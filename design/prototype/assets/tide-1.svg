<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c374d"/>
      <stop offset="0.42" stop-color="#6f5a6f"/>
      <stop offset="0.66" stop-color="#b87a72"/>
      <stop offset="0.82" stop-color="#dd9d72"/>
      <stop offset="1" stop-color="#f0c79a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.64" cy="0.74" r="0.3">
      <stop offset="0" stop-color="#ffe6b8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffd39a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffcf95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221f27"/>
      <stop offset="1" stop-color="#131117"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1020" cy="660" rx="430" ry="250" fill="url(#sun)"/>

  <g opacity="0.55" filter="url(#soft)">
    <ellipse cx="380" cy="300" rx="360" ry="90" fill="#3b3f55"/>
    <ellipse cx="1220" cy="380" rx="420" ry="70" fill="#5a4b62"/>
    <ellipse cx="820" cy="470" rx="520" ry="60" fill="#8a6470"/>
  </g>

  <g stroke="#cfd6e2" stroke-width="2" opacity="0.16">
    <line x1="120" y1="60" x2="90" y2="360"/>
    <line x1="260" y1="20" x2="230" y2="330"/>
    <line x1="420" y1="80" x2="390" y2="420"/>
    <line x1="600" y1="30" x2="570" y2="300"/>
    <line x1="760" y1="90" x2="730" y2="380"/>
    <line x1="940" y1="40" x2="910" y2="320"/>
    <line x1="1100" y1="70" x2="1070" y2="400"/>
    <line x1="1280" y1="20" x2="1250" y2="300"/>
    <line x1="1440" y1="90" x2="1410" y2="380"/>
    <line x1="1520" y1="40" x2="1490" y2="330"/>
  </g>

  <g opacity="0.9">
    <rect x="0" y="640" width="1600" height="260" fill="url(#sill)"/>
    <rect x="0" y="638" width="1600" height="4" fill="#f7d7ae" opacity="0.45"/>
    <rect x="0" y="704" width="1600" height="1" fill="#f7d7ae" opacity="0.12"/>
    <rect x="0" y="770" width="1600" height="1" fill="#f7d7ae" opacity="0.1"/>
  </g>

  <g transform="translate(1050 520)" opacity="0.92">
    <rect x="0" y="0" width="46" height="120" rx="8" fill="#1b1a20"/>
    <rect x="8" y="10" width="30" height="96" rx="5" fill="#2e2c36"/>
    <rect x="-8" y="104" width="62" height="20" rx="6" fill="#15141a"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.55"/>
</svg>
