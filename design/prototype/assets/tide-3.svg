<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f24"/>
      <stop offset="0.55" stop-color="#14171b"/>
      <stop offset="1" stop-color="#0c0e11"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.72" cy="0.14" r="0.42">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffbf78" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb765" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2520"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#room)"/>
  <ellipse cx="980" cy="120" rx="520" ry="330" fill="url(#lamp)"/>
  <rect x="0" y="560" width="1400" height="440" fill="url(#desk)"/>
  <rect x="0" y="556" width="1400" height="3" fill="#ffd9a0" opacity="0.22"/>

  <g opacity="0.5" filter="url(#blur3)">
    <ellipse cx="300" cy="700" rx="240" ry="70" fill="#000"/>
    <ellipse cx="1070" cy="760" rx="200" ry="60" fill="#000"/>
  </g>

  <g transform="translate(360 600)">
    <rect x="0" y="0" width="220" height="140" rx="16" fill="#26221f"/>
    <rect x="10" y="10" width="200" height="120" rx="12" fill="#1b1815"/>
    <rect x="26" y="26" width="168" height="88" rx="8" fill="#302a25"/>
    <g stroke="#4a423a" stroke-width="2" opacity="0.6">
      <line x1="36" y1="44" x2="184" y2="44"/>
      <line x1="36" y1="62" x2="184" y2="62"/>
      <line x1="36" y1="80" x2="140" y2="80"/>
    </g>
  </g>

  <g transform="translate(680 640)">
    <rect x="0" y="0" width="300" height="26" rx="13" fill="#3a332c"/>
    <rect x="0" y="0" width="300" height="9" rx="4.5" fill="#5c5044" opacity="0.7"/>
    <circle cx="20" cy="38" r="7" fill="#d9c4a4" opacity="0.5"/>
    <circle cx="46" cy="36" r="5" fill="#c2ab88" opacity="0.4"/>
    <circle cx="66" cy="40" r="4" fill="#e0cbaa" opacity="0.35"/>
  </g>

  <g transform="translate(1040 520)">
    <rect x="0" y="0" width="54" height="150" rx="10" fill="#1f1b18"/>
    <rect x="9" y="12" width="36" height="120" rx="6" fill="#2e2823"/>
    <rect x="-12" y="128" width="78" height="26" rx="8" fill="#151210"/>
    <ellipse cx="27" cy="-4" rx="26" ry="8" fill="#ffd9a0" opacity="0.5" filter="url(#blur3)"/>
  </g>

  <g stroke="#ffd9a0" stroke-width="1" opacity="0.12">
    <line x1="0" y1="640" x2="1400" y2="640"/>
    <line x1="0" y1="700" x2="1400" y2="700"/>
    <line x1="0" y1="780" x2="1400" y2="780"/>
  </g>

  <rect width="1400" height="1000" filter="url(#grain3)" opacity="0.6"/>
</svg>
