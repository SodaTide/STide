name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: stide core tests
        working-directory: tools/stide
        run: python -m unittest discover -s tests -v
      - name: plugin logic tests
        working-directory: plugin
        env:
          PYTHONPATH: ".:astrbot_plugin_stide"
        run: python -m unittest discover -s tests -v
      - name: vendor hash
        run: python tools/stide/scripts/check_vendor.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm check:content
        working-directory: site
      - run: pnpm build
        working-directory: site
